name: 构建 ALCERecipeViewer
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
env:
  MAVEN_OPTS: -Xmx2g -Xms512m -Dfile.encoding=UTF-8
jobs:
  build:
    name: 在 Ubuntu 上使用 JDK 21 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: 使用 Maven 打包（跳过测试）
        run: mvn clean package -DskipTests
      - name: 上传生成的 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: ALCERecipeViewer-JAR
          path: target/ALCERecipeViewer-*.jar
          if-no-files-found: error
